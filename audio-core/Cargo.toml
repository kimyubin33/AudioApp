[package]
name = "audio-core"
version = "0.1.0"
edition = "2024"

[dependencies]
uniffi = { version = "0.32.2", features = ["cli", "tokio"] }
# HTTPS 통신. 기본 기능(default-tls 등)을 끄고 rustls만 사용한다 (OpenSSL 사용 안 함).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# 안드로이드에서는 reqwest의 기본 인증서 검사(rustls-platform-verifier)가 JNI 초기화를 요구하므로,
# TLS 설정을 직접 만들고 신뢰할 루트 인증서(Mozilla 목록)를 앱에 내장한다. reqwest가 쓰는 rustls 0.23과 버전을 맞춘다.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
# reqwest와 UniFFI 비동기 함수가 쓰는 비동기 실행 환경. 필요한 기능만 켜다.
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
# 서버 응답(JSON)을 읽고 검증하기 위한 표준 라이브러리. uniffi의 하위 의존성으로 이미 들어와 있다.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 직접 작성한 Rust 코드의 unsafe 사용을 모든 타깃(라이브러리·CLI·테스트)에서 금지한다.
# 외부 의존성 및 UniFFI가 생성하는 FFI 내부의 안전성은 별도로 관리한다.
[lints.rust]
unsafe_code = "forbid"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true